    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var _fetch = nativeFetch ? nativeFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _fetch;
                },
                set: function(fn) {
                  _fetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (err) {
          console.warn('Could not define fetch setter:', err);
        }
      })();
    </script>
